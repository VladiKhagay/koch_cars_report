name = "car-prep-tracker-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Workers Logs. Without this there is no record of a 403 from /ocr or a 413
# from /upload, which means no way to notice either being hammered — the abuse
# these endpoints are exposed to is invisible rather than absent.
[observability]
enabled = true

# Per-user rate limits, keyed on the JWT `sub`.
#
# This app has no custom domain and will not be getting one, so Cloudflare's
# WAF Rate Limiting Rules — which only run on a zone — are unavailable. These
# bindings run inside the Worker instead and need no zone.
#
# Know what they are and are not: counters are local to each Cloudflare
# location and the service is documented as permissive and eventually
# consistent. This is a cost guardrail against one runaway client or one
# abusive account, not an accurate quota and not a defence against distributed
# abuse. Every route behind these already requires an active, admin-invited
# employee, so that is the population being bounded.
#
# /invite and /user-active are deliberately unlimited: both are admin-gated,
# and rate-limiting an admin out of user management during an incident is the
# worse failure.

# One job's capture flow costs 4 model runs (plate and VIN, each a detect then
# a read), so a busy worker sits well under 20/min even while retaking photos.
# 60 leaves ~3x headroom for humans while cutting a runaway retry loop — which
# would otherwise issue thousands — down to a bounded, affordable trickle.
[[ratelimits]]
name = "OCR_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Sized for the offline queue rather than for steady use. A phone that has been
# out of signal can flush a large backlog at once, and each queued job uploads
# up to 5 photos and a condition video in parallel — so a 20-job backlog is a
# legitimate ~120-request burst. Anything above this is not a yard catching up.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 150
  period = 60

# /video/start only, on top of UPLOAD_LIMITER. Each start opens an R2 multipart
# upload that parks up to 80 MiB for up to 7 days if never completed, so starts
# need a far tighter bound than pieces. A legitimate phone starts once per clip
# (twice after a 410 restart); 10/min covers a backlog of clips flushing in a
# row while capping how much storage one account can park. Real ceiling:
# 10/min x 80 MiB = ~800 MiB/min of incomplete uploads per account (~1 TiB/day),
# soft because counters are per location and eventually consistent. Open to a
# worker with an own job < 7 days old and no video row, and to any manager/admin.
# Incomplete uploads expire after 7 days (assumption until the lifecycle check in
# SECURITY-NOTES §4). namespace_id must not be used by any other Worker on the account.
[[ratelimits]]
name = "VIDEO_START_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 10
  period = 60

# R2 bucket used for job photos. Create with:
#   wrangler r2 bucket create car-prep-photos
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "car-prep-photos"

# Workers AI binding — OCR runs on Cloudflare's own models (Moondream),
# so there is no external OCR vendor, API key, or model-deprecation cycle
# to babysit. Free tier: 10,000 neurons/day, far above this app's usage.
[ai]
binding = "AI"

# ALLOWED_ORIGINS: comma-separated list of origins allowed to call this Worker
# (e.g. your Cloudflare Pages URL). Falls back to "*" if unset — tighten this
# before going live.
[vars]
ALLOWED_ORIGINS = "https://app.koch-kcx.app,https://koch-cars-report.vladik14.workers.dev"
# Invite emails link to APP_URL/welcome (must be allowlisted in Supabase
# Auth -> URL Configuration -> Redirect URLs).
APP_URL = "https://app.koch-kcx.app"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   SUPABASE_URL               — https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY          — Supabase project settings -> API -> anon/public key
#   SUPABASE_SERVICE_ROLE_KEY  — Supabase project settings -> API -> service_role.
#                                Used ONLY by /invite (admin-gated) to send auth
#                                invitations and pre-create the profile row —
#                                see src/invite.ts. Never exposed to the client.
#
# No JWT secret is stored here: incoming JWTs are verified against Supabase's
# public JWKS (SUPABASE_URL + /auth/v1/.well-known/jwks.json), which is how
# Supabase's current asymmetric JWT Signing Keys are meant to be verified —
# see worker/src/index.ts. If your project still shows a project settings ->
# JWT Keys page with only a "Legacy JWT Secret" (HS256) and no signing key,
# this Worker's auth won't validate — visit that page once in the dashboard
# to have Supabase provision a signing key, no code change needed here.
#
# The Worker also never uses a service-role key: photo uploads are authorized
# by forwarding the caller's own JWT to Supabase's REST API and relying on
# the same RLS policies that gate the frontend (see worker/src/upload.ts).
#
# R2 lifecycle rule (60-day photo and video expiry, migration 0025) is
# configured separately via:
#   wrangler r2 bucket lifecycle add car-prep-photos \
#     --id expire-60d --expire-days 60 --prefix ""
