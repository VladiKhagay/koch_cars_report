name: Nightly database backup

# Supabase's free tier has no point-in-time recovery, so this is the backup
# strategy: a nightly pg_dump, gzipped and pushed to a dedicated R2 bucket
# (separate from car-prep-photos, which has a 90-day lifecycle rule — backups
# must NOT be swept up by that rule, hence the separate bucket).
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC daily, off-peak
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump database
        env:
          # Supabase project settings -> Database -> Connection string (URI, "session" mode).
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > backup.sql.gz

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put \
            "car-prep-backups/$(date -u +%Y-%m-%d)/backup.sql.gz" \
            --file=backup.sql.gz --remote

      # Pruning is a lifecycle rule on the bucket, not scripted here — the
      # wrangler CLI has no `r2 object list` command to build a prune script
      # against. Set it up once (see worker/README.md):
      #   wrangler r2 bucket lifecycle add car-prep-backups \
      #     --id expire-180d --expire-days 180 --prefix ""
